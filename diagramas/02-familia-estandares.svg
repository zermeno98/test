      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
      #d-02-familia-estandares-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-02-familia-estandares-root .diagram-container { width:100%; overflow-x:auto; }
      #d-02-familia-estandares-root .diagram-container { overflow-x:visible; }</style>
