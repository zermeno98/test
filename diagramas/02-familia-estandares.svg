22" stroke-width="0.8"/><rect x="36" y="202" width="16" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="44" y="214" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text><text x="62" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Preparar la información</text><text x="62" y="228" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Herramienta autorizada, información</text><text x="62" y="240" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">clasificada y datos personales retirados</text><line x1="36" y1="244" x2="332" y2="244" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/><rect x="36" y="254" width="16" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="44" y="266" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2</text><text x="62" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Verificar los productos</text><text x="62" y="280" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Datos contrastados con fuentes, derechos</text><text x="62" y="292" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">de terceros y uso de IA declarado</text><line x1="36" y1="296" x2="332" y2="296" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/><rect x="36" y="306" width="16" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="44" y="318" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3</text><text x="62" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Atender incidentes</text><text x="62" y="332" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Solicitudes sospechosas confirmadas por</text><text x="62" y="344" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">otro canal e incidentes reportados</text><rect x="376" y="128" width="320" height="284" rx="6" fill="#f5f5f5"/><rect x="376" y="128" width="320" height="284" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="388" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">EC-B · Responsable de la IA</text><text x="388" y="170" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Para quien responde por la IA · nivel 4</text><line x1="388" y1="184" x2="684" y2="184" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/><rect x="388" y="202" width="16" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="396" y="214" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text><text x="414" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Integrar el inventario</text><text x="414" y="228" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Cada sistema de IA con su proveedor,</text><text x="414" y="240" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">uso, área responsable y datos que procesa</text><line x1="388" y1="244" x2="684" y2="244" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/><rect x="388" y="254" width="16" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="396" y="266" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2</text><text x="414" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Evaluar los riesgos</text><text x="414" y="280" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Matriz de riesgos y evaluación de impacto</text><text x="414" y="292" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">de los usos que afectan a las personas</text><line x1="388" y1="296" x2="684" y2="296" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/><rect x="388" y="306" width="16" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="396" y="318" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3</text><text x="414" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Establecer política y controles</text><text x="414" y="332" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Política de uso, revisión de proveedores,</text><text x="414" y="344" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">plan de controles y capacitación</text><line x1="388" y1="348" x2="684" y2="348" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/><rect x="388" y="358" width="16" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="396" y="370" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4</text><text x="414" y="370" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Supervisar y atender incidentes</text><text x="414" y="384" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Verificación de controles, registro de</text><text x="414" y="396" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">incidentes e informe a la dirección</text><rect x="36" y="352" width="296" height="52" rx="6" fill="#f5f5f5"/><rect x="36" y="352" width="296" height="52" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/><text x="48" y="369" fill="#eb6c36" font-size="7.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">CÓMO SE CONECTAN</text><text x="48" y="384" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">El EC-B define la capacitación del personal;</text><text x="48" y="397" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">el EC-A acredita que el personal la aplica</text><line x1="24" y1="428" x2="696" y2="428" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/><text x="24" y="446" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEYENDA</text><rect x="24" y="452" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="46" y="460" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Estándar y elementos</text><rect x="174" y="452" width="16" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1" stroke-dasharray="3,2"/><text x="196" y="460" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Vínculo entre estándares</text><line x1="344" y1="457" x2="368" y2="457" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-02-familia-estandares-familia-estandares-arrow)"/><text x="376" y="460" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Se desglosa en</text></svg>
