<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 476" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="familia-estandares-title familia-estandares-desc" data-w="720" id="d-02-familia-estandares-root"><title id="familia-estandares-title">Dos estándares: uno para quien usa la IA y otro para quien responde por ella</title><desc id="familia-estandares-desc">El propósito principal se desglosa en el EC-A, con tres elementos para el usuario de IA, y el EC-B, con cuatro para el responsable; el programa de capacitación del EC-B se acredita en el personal mediante el EC-A.</desc>
