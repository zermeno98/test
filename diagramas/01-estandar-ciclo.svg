<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="estandar-ciclo-title estandar-ciclo-desc" data-w="720" id="d-01-estandar-ciclo-root"><title id="estandar-ciclo-title">Un estándar se crea una vez y certifica a muchas personas</title><desc id="estandar-ciclo-desc">Dos carriles: el Comité de Gestión redacta el estándar, el Comité Técnico lo aprueba y se publica en el DOF y el RENEC; con esa referencia, un centro acreditado evalúa a cada persona y le otorga el certificado oficial.</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
