="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REFERENCIA</text><path d="M424,272 V288 Q424,296 416,296 H248 Q240,296 240,288 V272" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-01-estandar-ciclo-estandar-ciclo-arrow)"/><rect x="286" y="278" width="92" height="12" rx="2" fill="#f5f5f5"/><text x="332" y="287" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REEVALUACIÓN</text><rect x="160" y="40" width="160" height="80" rx="6" fill="#f5f5f5"/><rect x="160" y="40" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="172" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Comité de Gestión</text><text x="172" y="82" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Empleadores, trabajadores</text><text x="172" y="95" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">e instituciones redactan</text><text x="172" y="108" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">el estándar</text><rect x="344" y="40" width="160" height="80" rx="6" fill="#f5f5f5"/><rect x="344" y="40" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="356" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Comité Técnico</text><text x="356" y="82" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Revisa el estándar</text><text x="356" y="95" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">y lo aprueba</text><rect x="528" y="40" width="160" height="80" rx="6" fill="#f5f5f5"/><rect x="528" y="40" width="160" height="80" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/><text x="540" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">DOF y RENEC</text><text x="540" y="82" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Publicación oficial y</text><text x="540" y="95" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">consulta pública</text><text x="540" y="108" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">y gratuita</text><rect x="160" y="192" width="160" height="80" rx="6" fill="#f5f5f5"/><rect x="160" y="192" width="160" height="80" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.38" stroke-width="1" stroke-dasharray="4,3"/><text x="172" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Preparación</text><text x="172" y="234" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Curso de alineación,</text><text x="172" y="247" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">opcional</text><rect x="344" y="192" width="160" height="80" rx="6" fill="#f5f5f5"/><rect x="344" y="192" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="356" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Evaluación</text><text x="356" y="234" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Un centro acreditado</text><text x="356" y="247" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">observa a la persona</text><text x="356" y="260" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">y revisa sus evidencias</text><rect x="528" y="192" width="160" height="80" rx="6" fill="#f5f5f5"/><rect x="528" y="192" width="160" height="80" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/><text x="540" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Certificado oficial</text><text x="540" y="234" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Si demuestra la</text><text x="540" y="247" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">competencia; vale en</text><text x="540" y="260" fill="#4f5d75" font-size="10" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">todo el país</text><line x1="24" y1="328" x2="696" y2="328" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/><text x="24" y="346" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEYENDA</text><rect x="24" y="352" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="46" y="360" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Paso</text><rect x="94" y="352" width="16" height="10" rx="2" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.38" stroke-width="1" stroke-dasharray="3,2"/><text x="116" y="360" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Paso opcional</text><rect x="209" y="352" width="16" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/><text x="231" y="360" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Registro público</text><rect x="339" y="352" width="16" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/><text x="361" y="360" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Resultado</text><line x1="434" y1="357" x2="458" y2="357" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#d-01-estandar-ciclo-estandar-ciclo-arrow)"/><text x="466" y="360" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Flujo</text><line x1="519" y1="357" x2="543" y2="357" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#d-01-estandar-ciclo-estandar-ciclo-arrow)"/><text x="551" y="360" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Reintento si aún no es competente</text></svg>
